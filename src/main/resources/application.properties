spring.application.name=devops-health-monitor

# Прод/докер-конфигурация - PostgreSQL. Для тестов (./mvnw test) используется отдельный
# src/test/resources/application.properties с H2 in-memory, чтобы тесты не требовали
# поднятой базы. Переменные окружения совпадают с docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:botops}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:botops}
spring.datasource.password=${DB_PASSWORD:botops}

# Схему теперь ведёт Flyway (src/main/resources/db/migration) - Hibernate только проверяет,
# что entity-маппинги соответствуют реальной схеме, но сам её не меняет.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

management.otlp.metrics.export.enabled=false

# HTTP Basic на весь сайт - один пользователь, логин/пароль настраиваются переменными
# окружения (см. docker-compose.yml). SecurityFilterChain - в config/SecurityConfig.java
# (дефолтной автоконфигурации не хватило - она включает CSRF, ломающий Basic Auth на POST).
spring.security.user.name=${APP_ADMIN_USER:admin}
spring.security.user.password=${APP_ADMIN_PASSWORD:changeme}

# Если бот со статусом RUNNING не присылал heartbeat дольше N минут - помечаем его DOWN
app.bot.heartbeat-timeout-minutes=5
# Как часто проверяем ботов на "молчание" (в мс)
app.bot.heartbeat-check-interval-ms=60000
# Если суммарный P&L бота по сделкам падает ниже этого значения - показываем алерт на дашборде
app.bot.pnl-alert-threshold=-50

