spring.application.name=devops-health-monitor

# Тестовая конфигурация - H2 in-memory, чтобы ./mvnw test не требовал поднятой PostgreSQL.
# Прод/докер-конфигурация лежит в src/main/resources/application.properties.
# MODE=PostgreSQL - те же миграции из db/migration должны без изменений накатываться
# и на H2 в тестах, и на настоящий Postgres в проде/докере.
spring.datasource.url=jdbc:h2:mem:devopsdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Схему ведёт Flyway (те же миграции, что и в проде) - Hibernate только проверяет маппинги.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.h2.console.enabled=true

management.otlp.metrics.export.enabled=false

spring.security.user.name=test-admin
spring.security.user.password=test-password

app.bot.heartbeat-timeout-minutes=5
app.bot.heartbeat-check-interval-ms=60000
app.bot.pnl-alert-threshold=-50
